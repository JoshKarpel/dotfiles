# Linked to $CARGO_HOME/config.toml by install.sh, so it applies to every
# project's dev and test builds on this machine.
#
# A target directory keeps every artifact it has ever linked, and each worktree
# has its own, so the size of one debug artifact is multiplied many times over.
# Line tables keep backtraces and panics pointing at file and line; what goes is
# a debugger's view of local variables, here and in every dependency.
#
# This file outranks a project's Cargo.toml [profile] tables, so a manifest
# cannot opt back in. A project's own .cargo/config.toml outranks this file, but
# table by table: restoring full debug info there takes both [profile.dev] and
# [profile.dev.package."*"], since the second is more specific than the first.
#
# No rustc-wrapper: kache (https://github.com/kunobi-ninja/kache), whose pitch
# is sharing artifacts across worktrees, doesn't pay on the dev boxes as of
# v2.1.1. Without copy-on-write clones (exe.dev VMs are ext4), it hardlinks a
# cached artifact into one target directory and copies it into every other, so
# a second worktree of the same revision measured about 30% smaller while a
# lone one grew about 18% from the store beside it. Its
# `shared_hardlink_restores` option shrank each extra worktree by about 60%,
# but a restore re-dates the shared inode in every tree that links it, so
# building one worktree made cargo recompile unchanged crates in the others.
# Worth trying again on a reflink-capable filesystem (btrfs, XFS, APFS), or if
# kache can share hardlinks without touching their mtimes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
