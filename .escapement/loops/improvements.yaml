prompt: |
  Make this dotfiles repository a little better in whatever way it most needs today. There is no
  single axis to push on: this is tooling that a person and an agent both use every day, and its
  rough edges are wherever the two disagree with each other or with the docs.

  Prefer, in rough order:

  - A `bin/` script that fails silently, exits 0 on a path that did not work, or reports a
    failure in terms nobody can act on.
  - A guardrail hook in `claude/settings.json` that does not cover a case it obviously means to,
    or whose message says what is wrong without saying what to do instead.
  - A hook that should carry self-tests and does not. `claude-hook-selftests` finds participants
    by their `CLAUDE_HOOK_SELFTEST` marker line; a hook that always exits 0 has to assert on which
    downstream commands it reached.
  - Prose that contradicts the code it describes: `CLAUDE.md`, `README.md`, or a rule under
    `claude/rules/` whose facts have gone stale.

  Two things about this repository in particular. Its rules are addressed to agents, so a rule
  whose argument is sound but whose example no longer matches the code is worth fixing and its
  argument is not worth relitigating. And every `bin/` script is on PATH for interactive sessions,
  so a change to one takes effect immediately for a person, not just for a run.

  Verify with `pre-commit-autofix`, and with `CLAUDE_HOOK_SELFTEST=1 claude-hook-selftests` when
  you touched a hook that carries them. Both are on PATH. A `bin/` script is live for the person
  at this machine the moment you change it, so exercise what you changed rather than reasoning
  about it: drive it in a directory you made for the purpose, never against this machine's own
  state, and never against a port, process, or service you did not start yourself.

  Avoid: new tools nobody asked for, moving files between directories, dependency upgrades, and
  broad rewrites of documents that are merely opinionated.

schedule:
  cron: "0 5 * * *"
  timezone: America/Chicago

max_active_runs: 1

publish:
  kind: pull-request
  assignees: ["JoshKarpel"]
  fix_checks: true

budget:
  per_session: 5.0
  extra_sessions: 3

harness:
  kind: claude-code
  args: ["--model", "sonnet", "--effort", "high"]
  timeout: PT60M
