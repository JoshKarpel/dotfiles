# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
      - id: file-contents-sorter
        files: "^targets/.*$"

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.4.3
    hooks:
      - id: beautysh
        args: ["--indent-size", "2"]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf

  - repo: local
    hooks:
      - id: claude-hook-selftests
        name: claude hook self-tests
        entry: bin/claude-hook-selftests
        language: script
        pass_filenames: false
        files: ^bin/
      # Every inline script with dependencies has a <script>.lock beside it
      # matching its metadata. Running a script whose pins changed relocks it,
      # so this catches a pin edited and committed without a run.
      - id: uv-script-locks
        name: uv script locks
        entry: >-
          bash -c 'status=0; for script in bin/*; do
          [[ -f "$script" ]] && grep -q "^# dependencies = \[.\+\]" "$script" || continue;
          uv lock --check --quiet --script "$script" 2>/dev/null
          || { echo "$script.lock is missing or stale; run: uv lock --script $script"; status=1; };
          done; exit "$status"'
        language: unsupported
        pass_filenames: false
        files: ^bin/

ci:
  # The self-tests shell out to hooks that expect a real dev environment
  # (jq, python3, git state), and the lock check needs uv; skip them on
  # pre-commit.ci and rely on the GitHub workflow, which has both.
  skip: [claude-hook-selftests, uv-script-locks]
