# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
      - id: file-contents-sorter
        files: "^targets/.*$"

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.4.3
    hooks:
      - id: beautysh
        args: ["--indent-size", "2"]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf

  - repo: local
    hooks:
      # The gitleaks binary comes from mise (config/mise/config.toml) rather than from
      # pre-commit's own environment, so one version serves this hook and `git land`.
      # It scans what is staged, which is everything by the time the stop hook runs it.
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
      - id: claude-hook-selftests
        name: claude hook self-tests
        entry: bin/claude-hook-selftests
        language: script
        # One invocation for the whole change-set, so the hooks a change affects
        # are selected once and run together rather than split across batches.
        require_serial: true
        files: ^bin/
      - id: check-bin-help
        name: bin scripts answer --help
        entry: bin/check-bin-help
        language: script
        files: ^bin/

ci:
  # The self-tests shell out to hooks that expect a real dev environment
  # (jq, python3, git state), and check-bin-help runs the uv scripts, which
  # needs uv; skip both on pre-commit.ci and rely on the GitHub workflow,
  # which has them. gitleaks is installed by mise, which neither
  # runner has; it guards the commit and `git land`, both before anything is
  # published, so a scan after the push would catch nothing in time.
  skip: [claude-hook-selftests, check-bin-help, gitleaks]
