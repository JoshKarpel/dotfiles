# Global mise config. Symlinked to ~/.config/mise/config.toml by install.sh.
# Per-project versions live in each repo's mise.toml / .tool-versions.
# node replaces nvm; rust wraps rustup; uv installs the binary (uv owns venvs).

[settings]
# Supply-chain cooldown: ignore releases newer than this for fuzzy resolution.
minimum_release_age = "7d"

[settings.node]
# Run `corepack enable` after installing node, activating the bundled
# package-manager shims (yarn, pnpm).
corepack = true

[tools]
ast-grep = "latest"
bottom = "latest"
"cargo:cargo-edit" = "latest"
"cargo:claude-scriptorium" = "latest"
dust = "latest"
fd = "latest"
gh = "latest"
# Prebuilt binary rather than `cargo:`, which builds samply from source.
"github:mstange/samply" = "latest"
helm = "latest"
hyperfine = "latest"
jq = "latest"
just = "latest"
k9s = "latest"
kubectl = "latest"
node = "lts"
ripgrep = "latest"
rust = "stable"
sd = "latest"
starship = "latest"
tokei = "latest"
uv = "latest"
yq = "latest"
zellij = "latest"
