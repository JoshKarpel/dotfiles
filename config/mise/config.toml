# Global mise config. Symlinked to ~/.config/mise/config.toml by install.sh.
# Per-project versions live in each repo's mise.toml / .tool-versions.
# node replaces nvm; rust wraps rustup; uv installs the binary (uv owns venvs).

[settings]
# Supply-chain cooldown: ignore releases newer than this for fuzzy resolution.
minimum_release_age = "7d"
# The cooldown buys time for a compromised publish to be noticed by someone
# else. That is worth a week of lag for a dependency, and nothing for a release
# cut from an account whose compromise would already be my own problem to
# notice. Exempted so a release is servable the day it ships: `cloister` on the
# exe.dev boxes runs whatever version this resolves to.
minimum_release_age_excludes = ["github:JoshKarpel/claude-scriptorium"]

[settings.node]
# Run `corepack enable` after installing node, activating the bundled
# package-manager shims (yarn, pnpm).
corepack = true

[tools]
ast-grep = "latest"
bottom = "latest"
dust = "latest"
fd = "latest"
gh = "latest"
# Prebuilt binaries rather than `cargo:`, which builds from source. It matters
# most for the scriptorium: under `cargo:` the timer that keeps it current would
# rebuild on every release, spending minutes of a dev box's CPU on what a
# download settles in seconds. `github:` also verifies GitHub artifact
# attestations and SLSA provenance, which `cargo:` has no equivalent of.
"github:JoshKarpel/claude-scriptorium" = "latest"
"github:mstange/samply" = "latest"
helm = "latest"
hyperfine = "latest"
jq = "latest"
just = "latest"
k9s = "latest"
kubectl = "latest"
node = "lts"
ripgrep = "latest"
rust = "stable"
sd = "latest"
starship = "latest"
tokei = "latest"
uv = "latest"
vscode-cli = "latest"
yq = "latest"
zellij = "latest"
